image:
  repository: ghcr.io/fattyatom/clusterdeck
  tag: ""
  pullPolicy: IfNotPresent

clusterName: cluster

auth:
  header: ""
  allowedUsers: []
  oidc:
    issuerURL: ""
    clientID: ""
    redirectURL: ""
    userClaim: email
    scopes: [openid, email, profile]
    existingSecret: ""
    clientSecretKey: client-secret
    sessionSecretKey: ""

actions:
  enabled: false
  namespaces: []
  autoRollback:
    enabled: false
    interval: 30s

hideNamespaces: [kube-system, kube-public, kube-node-lease]

selectors:
  backup: clusterdeck.io/role=backup
  restoreCheck: clusterdeck.io/role=restore-check
  restoreTemplate: clusterdeck.io/role=restore-template

gitops:
  github:
    existingSecret: ""
    secretKey: token
    apiURL: https://api.github.com
    app:
      existingSecret: ""
      appIDKey: app-id
      privateKeyKey: private-key

inflight:
  repo: ""
  branch: main
  soakSeconds: 3600
  watchSeconds: 3600

metrics:
  provider: none
  signoz:
    url: ""
    filter: ""
    existingSecret: ""
    secretKey: api-key
  prometheus:
    url: ""

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

networkPolicy:
  enabled: false
  ingressFromNamespaces: []

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}

nodeSelector: {}
tolerations: []
affinity: {}
