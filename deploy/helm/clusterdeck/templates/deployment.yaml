{{- if and .Values.actions.autoRollback.enabled (not .Values.actions.enabled) }}
{{- fail "actions.autoRollback.enabled needs actions.enabled" }}
{{- end }}
{{- if and .Values.actions.enabled (not .Values.auth.header) (not .Values.auth.oidc.issuerURL) }}
{{- fail "actions.enabled needs auth.header or auth.oidc: actions are only allowed for an identified user" }}
{{- end }}
{{- if and .Values.auth.header .Values.auth.oidc.issuerURL }}
{{- fail "set auth.header or auth.oidc, not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clusterdeck.fullname" . }}
  labels: {{- include "clusterdeck.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "clusterdeck.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clusterdeck.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "clusterdeck.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clusterdeck
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: CLUSTER_NAME, value: {{ .Values.clusterName | quote }}}
            - {name: AUTH_HEADER, value: {{ .Values.auth.header | quote }}}
            - {name: AUTH_ALLOWED_USERS, value: {{ join "," .Values.auth.allowedUsers | quote }}}
            {{- with .Values.auth.oidc }}
            {{- if .issuerURL }}
            - {name: OIDC_ISSUER_URL, value: {{ .issuerURL | quote }}}
            - {name: OIDC_CLIENT_ID, value: {{ required "auth.oidc.clientID is required" .clientID | quote }}}
            - {name: OIDC_REDIRECT_URL, value: {{ required "auth.oidc.redirectURL is required" .redirectURL | quote }}}
            - {name: OIDC_USER_CLAIM, value: {{ .userClaim | quote }}}
            - {name: OIDC_SCOPES, value: {{ join "," .scopes | quote }}}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidc.existingSecret is required" .existingSecret }}
                  key: {{ .clientSecretKey }}
            {{- if .sessionSecretKey }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .sessionSecretKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            - {name: ACTIONS_ENABLED, value: {{ .Values.actions.enabled | quote }}}
            - {name: ACTIONS_NAMESPACES, value: {{ join "," .Values.actions.namespaces | quote }}}
            - {name: AUTO_ROLLBACK_ENABLED, value: {{ .Values.actions.autoRollback.enabled | quote }}}
            - {name: AUTO_ROLLBACK_INTERVAL, value: {{ .Values.actions.autoRollback.interval | quote }}}
            - {name: HIDE_NAMESPACES, value: {{ join "," .Values.hideNamespaces | quote }}}
            - {name: BACKUP_SELECTOR, value: {{ .Values.selectors.backup | quote }}}
            - {name: RESTORE_CHECK_SELECTOR, value: {{ .Values.selectors.restoreCheck | quote }}}
            - {name: RESTORE_TEMPLATE_SELECTOR, value: {{ .Values.selectors.restoreTemplate | quote }}}
            - {name: METRICS_PROVIDER, value: {{ .Values.metrics.provider | quote }}}
            {{- if eq .Values.metrics.provider "signoz" }}
            - {name: SIGNOZ_URL, value: {{ required "metrics.signoz.url is required" .Values.metrics.signoz.url | quote }}}
            - {name: SIGNOZ_FILTER, value: {{ .Values.metrics.signoz.filter | quote }}}
            - name: SIGNOZ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "metrics.signoz.existingSecret is required" .Values.metrics.signoz.existingSecret }}
                  key: {{ .Values.metrics.signoz.secretKey }}
            {{- end }}
            {{- if or .Values.gitops.github.existingSecret .Values.gitops.github.app.existingSecret }}
            - {name: GITHUB_API_URL, value: {{ .Values.gitops.github.apiURL | quote }}}
            {{- end }}
            {{- with .Values.gitops.github.existingSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.gitops.github.secretKey }}
            {{- end }}
            {{- with .Values.gitops.github.app.existingSecret }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.gitops.github.app.appIDKey }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.gitops.github.app.privateKeyKey }}
            {{- end }}
            {{- with .Values.inflight.repo }}
            - {name: INFLIGHT_REPO, value: {{ . | quote }}}
            - {name: INFLIGHT_BRANCH, value: {{ $.Values.inflight.branch | quote }}}
            - {name: SOAK_SECONDS, value: {{ $.Values.inflight.soakSeconds | quote }}}
            - {name: WATCH_SECONDS, value: {{ $.Values.inflight.watchSeconds | quote }}}
            {{- end }}
            {{- if eq .Values.metrics.provider "prometheus" }}
            - {name: PROMETHEUS_URL, value: {{ required "metrics.prometheus.url is required" .Values.metrics.prometheus.url | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
